name: Update Dev Changelog

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Skip running if the commit message itself was a changelog update (prevents loops)
    if: "!contains(github.event.head_commit.message, 'chore: update dev changelog')"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so the changelog can be built accurately

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --unreleased --output CHANGELOG.md

      - name: Commit and Push Changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update dev changelog [skip ci]"
          file_pattern: 'CHANGELOG.md'